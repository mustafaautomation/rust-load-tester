[package]
name = "rust-load-tester"
version = "1.0.0"
edition = "2021"
authors = ["Quvantic <info@quvantic.com>"]
description = "High-performance HTTP load testing CLI built with Rust and Tokio"
license = "MIT"
repository = "https://github.com/mustafaautomation/rust-load-tester"
homepage = "https://quvantic.com"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
